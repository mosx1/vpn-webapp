# Деплой: сборка Docker-образа → push в GHCR → на сервере docker compose pull && up.
# Запуск: Actions → Deploy to server → Run workflow.
#
# Ветка для сборки: список «Use workflow from» сверху.
# Поле ref — только если нужен tag или SHA (обычно пустое).
#
# Секреты (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY — SSH на сервер.
#   GHCR_PULL_USERNAME, GHCR_PULL_TOKEN — опционально, если образ приватный.
#
# Переменные (Variables), по желанию:
#   DEPLOY_PATH — каталог на сервере (по умолчанию /root/vpn-webapp).
#   DEPLOY_SSH_PORT — порт SSH (по умолчанию 22).

name: Deploy to server

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Необязательно — tag или SHA вместо выбранной ветки
        required: false

concurrency:
  group: deploy-server
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref != '' && github.event.inputs.ref || github.ref }}

      - name: Deploy target
        run: |
          echo "checkout_ref=${{ github.event.inputs.ref != '' && github.event.inputs.ref || github.ref }}"
          echo "commit=${{ github.sha }}"

      - name: Имя образа (GHCR в нижнем регистре)
        id: image
        run: |
          R=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo_lc=${R}" >> "$GITHUB_OUTPUT"
          echo "image_sha=ghcr.io/${R}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Pack docker-compose for server
        id: compose
        run: |
          COMPOSE_B64=$(base64 -w 0 docker-compose.yml)
          echo "b64=${COMPOSE_B64}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: DockerFile
          push: true
          tags: |
            ${{ steps.image.outputs.image_sha }}
            ghcr.io/${{ steps.image.outputs.repo_lc }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: SSH — docker compose pull && up
        uses: appleboy/ssh-action@v1.2.1
        env:
          DEPLOY_IMAGE: ${{ steps.image.outputs.image_sha }}
          GHCR_USER: ${{ secrets.GHCR_PULL_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          COMPOSE_B64: ${{ steps.compose.outputs.b64 }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ vars.DEPLOY_SSH_PORT || 22 }}
          envs: DEPLOY_IMAGE,GHCR_USER,GHCR_TOKEN,COMPOSE_B64
          script: |
            set -euo pipefail
            DEPLOY_PATH='${{ vars.DEPLOY_PATH }}'
            if [ -z "$DEPLOY_PATH" ]; then DEPLOY_PATH='/root/vpn-webapp'; fi
            mkdir -p "$DEPLOY_PATH"
            printf '%s' "$COMPOSE_B64" | base64 -d > "$DEPLOY_PATH/docker-compose.yml"
            if [ -n "${GHCR_TOKEN:-}" ] && [ -n "${GHCR_USER:-}" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            fi
            cd "$DEPLOY_PATH"
            export DEPLOY_IMAGE
            docker compose pull
            docker compose up -d --remove-orphans
