<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
    <title>Смена сервера — VРN</title>
    <style>
        :root {
            --font: "DM Sans", system-ui, -apple-system, sans-serif;
            --text: #0f172a;
            --text-muted: #64748b;
            --surface: #ffffff;
            --surface-soft: #f8fafc;
            --border: rgb(148 163 184 / 0.22);
            --primary: #dc2626;
            --primary-dark: #b91c1c;
            --primary-glow: rgb(220 38 38 / 0.35);
            --radius: 16px;
            --shadow-lg: 0 4px 6px -1px rgb(15 23 42 / 0.06),
                0 16px 32px -8px rgb(15 23 42 / 0.12);
        }
        *, *::before, *::after { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            font-family: var(--font);
            background: fixed radial-gradient(1200px 800px at 80% -10%, rgb(239 246 255 / 0.9), transparent),
                radial-gradient(900px 600px at -10% 40%, rgb(254 226 226 / 0.45), transparent),
                linear-gradient(180deg, #f1f5f9 0%, #e8eef5 100%);
            margin: 0;
            min-height: 100dvh;
            padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
                max(24px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
            color: var(--text);
            line-height: 1.6;
        }
        .container {
            width: 100%;
            max-width: min(100%, 520px);
            margin: clamp(12px, 3vw, 32px) auto;
            background: var(--surface);
            border-radius: clamp(14px, 3vw, 22px);
            box-shadow: var(--shadow-lg);
            border: 1px solid rgb(255 255 255 / 0.8);
            padding: clamp(20px, 5vw, 40px) clamp(16px, 4vw, 32px);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), #f97316, var(--primary-dark));
        }
        .update-gif {
            width: 100%;
            max-width: 320px;
            height: auto;
            margin: 0 auto 1.25rem;
            display: block;
            border-radius: var(--radius);
        }
        h1 {
            font-size: clamp(1.1rem, 3.2vw, 1.35rem);
            font-weight: 600;
            margin: 0 0 1.25rem;
            line-height: 1.4;
            color: var(--text);
        }
        a.button {
            touch-action: manipulation;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 46px;
            padding: 12px clamp(18px, 4vw, 28px);
            border-radius: 999px;
            font-weight: 600;
            font-size: clamp(0.92rem, 2.4vw, 1.02rem);
            text-decoration: none;
            background: linear-gradient(145deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: #fff !important;
            box-shadow: 0 4px 14px var(--primary-glow);
        }
        a.button:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 3px;
        }
        @media (min-width: 481px) {
            a.button:hover {
                filter: brightness(1.05);
                transform: translateY(-2px);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img
            class="update-gif"
            src="{{ url_for('static', filename='gif/update_sub.gif') }}"
            alt="Как обновить подписку после смены сервера"
            loading="eager"
            decoding="async"
        >
        <h1>Не забудьте обновить подписку после смены сервера</h1>
        <a href="/sub/home?token={{ token }}" class="button">Личный кабинет</a>
    </div>
</body>
</html>
